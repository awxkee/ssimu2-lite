name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 'main'
      - '!ci_test_*'
    tags-ignore:
      - '*'
  pull_request:
    branches:
      - 'main'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: rustup target add aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu i686-unknown-linux-gnu powerpc-unknown-linux-gnu wasm32-unknown-unknown
      - run: RUSTFLAGS="-C target-feature=+neon" cargo build --target aarch64-unknown-linux-gnu
      - run: cargo build --target aarch64-unknown-linux-gnu --no-default-features --features neon
      - run: cargo build --target i686-unknown-linux-gnu
      - run: cargo build --target i686-unknown-linux-gnu --no-default-features --features sse
      - run: cargo build --target powerpc-unknown-linux-gnu
      - run: cargo build --target x86_64-unknown-linux-gnu
      - run: cargo build --target x86_64-unknown-linux-gnu --no-default-features --features avx
      - run: cargo build --target x86_64-unknown-linux-gnu --no-default-features --features sse
      - run: cargo build --no-default-features --target x86_64-unknown-linux-gnu
      - run: cargo build --target wasm32-unknown-unknown

  test_x86:
    name: Test x86
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
        env:
          SSIMU2_REQUIRE_SIMD: avx2
      - run: cargo test --release --no-default-features --features avx
        env:
          SSIMU2_REQUIRE_SIMD: avx2
      - run: cargo test --release --no-default-features --features sse
        env:
          SSIMU2_REQUIRE_SIMD: sse4.1
      - run: cargo test --release --no-default-features

  test_x86_32:
    name: Test x86 32-bit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - name: Install 32-bit linker support
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-multilib
      - run: cargo test --release --target i686-unknown-linux-gnu
        env:
          SSIMU2_REQUIRE_SIMD: sse4.1
      - run: cargo test --release --target i686-unknown-linux-gnu --no-default-features --features sse
        env:
          SSIMU2_REQUIRE_SIMD: sse4.1
      - run: cargo test --release --target i686-unknown-linux-gnu --no-default-features

  test_arm:
    name: Test ARM
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
        env:
          SSIMU2_REQUIRE_SIMD: neon
      - run: cargo test --release --no-default-features --features neon
        env:
          SSIMU2_REQUIRE_SIMD: neon
      - run: cargo test --release --no-default-features

  clippy_x86:
    name: Clippy x86 Stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo clippy --all-targets --all-features -- -D warnings

  clippy_arm:
    name: Clippy ARM
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo clippy --all-targets -- -D warnings
